name: Ultimate CI/CD Pipeline 

on: 
  push:
    branches:
      - main 

jobs:

  # --- BOX 1 (Top Left) ---
  build-backend:
    runs-on: ubuntu-latest 
    steps:
      - name: Download Backend Code
        uses: actions/checkout@v4
      - name: Install Node js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies 
        run: npm install 
      - name: Run Backend Tests 
        run: npm run test 

  # --- BOX 2 (Bottom Left) ---
  build-frontend:
    runs-on: ubuntu-latest 
    steps:
      - name: Download Frontend Code
        uses: actions/checkout@v4
      - name: Install Node js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies 
        run: npm install 
      - name: Run Frontend Tests 
        run: npm run test 

  # --- BOX 3 (Top Middle) ---
  push-backend: 
    runs-on: ubuntu-latest 
    needs: build-backend         # Connects to Box 1
    steps:
      - name: Download Code
        uses: actions/checkout@v4 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Backend Image
        run: | 
          docker build -t jeffrinjojo/hr-backend:latest .
          docker push jeffrinjojo/hr-backend:latest

  # --- BOX 4 (Bottom Middle) ---
  push-frontend: 
    runs-on: ubuntu-latest 
    needs: build-frontend        # Connects to Box 2
    steps:
      - name: Download Code
        uses: actions/checkout@v4 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Frontend Image
        run: | 
          # In a real app, this would be a separate frontend Dockerfile!
          docker build -t jeffrinjojo/hr-frontend:latest .
          docker push jeffrinjojo/hr-frontend:latest

  # --- BOX 5 (The Merger on the Right) ---
  update-k8s:
    runs-on: ubuntu-latest
    needs: [push-backend, push-frontend]   # Connects to Box 3 AND Box 4!
    steps:
      - name: Update Kubernetes Manifests
        run: echo "Updating Kubernetes to pull the new latest images..."
