name: Ultimate Master CI/CD Pipeline 

# 1. TRIGGER: When does this run?
on: 
  push:
    branches:
      - main 

# 2. ENV: Global variables that every job can read
env:
  DOCKER_REGISTRY: jeffrinjojo
  PROJECT_VERSION: latest

jobs:

  # ---------------------------------------------------------
  # PHASE 1: CI (Testing in Parallel)
  # ---------------------------------------------------------

  test-backend:
    runs-on: ubuntu-latest 
    steps:
      - name: Download Code
        uses: actions/checkout@v4
      
      - name: Install Node.js & CACHE
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # THE OPTIMIZATION TRICK: Saves 5 minutes by reusing downloads!
          cache: 'npm'  

      - name: Install Dependencies 
        run: npm install 
        
      - name: Run Backend Tests 
        run: npm run test 

  test-frontend:
    runs-on: ubuntu-latest 
    steps:
      - name: Download Code
        uses: actions/checkout@v4
        
      - name: Install Node.js & CACHE
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' 
          
      - name: Install Dependencies 
        run: npm install 
        
      - name: Run Frontend Tests 
        run: npm run test 


  # ---------------------------------------------------------
  # PHASE 2: CD (Build and Push in Parallel)
  # ---------------------------------------------------------

  push-backend: 
    runs-on: ubuntu-latest 
    # THE MERGE TRICK: Do not start unless the backend test passes!
    needs: test-backend         
    steps:
      - name: Download Code
        uses: actions/checkout@v4 
        
      - name: Secure Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # SECRETS TRICK: Pulling hidden passwords from GitHub
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Backend Image
        # ENV TRICK: Using our global variables defined at the very top!
        run: | 
          docker build -t ${{ env.DOCKER_REGISTRY }}/hr-backend:${{ env.PROJECT_VERSION }} .
          docker push ${{ env.DOCKER_REGISTRY }}/hr-backend:${{ env.PROJECT_VERSION }}


  push-frontend: 
    runs-on: ubuntu-latest 
    needs: test-frontend        
    steps:
      - name: Download Code
        uses: actions/checkout@v4 
        
      - name: Secure Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and Push Frontend Image
        run: | 
          docker build -t ${{ env.DOCKER_REGISTRY }}/hr-frontend:${{ env.PROJECT_VERSION }} .
          docker push ${{ env.DOCKER_REGISTRY }}/hr-frontend:${{ env.PROJECT_VERSION }}


  # ---------------------------------------------------------
  # PHASE 3: CD (Update Kubernetes)
  # ---------------------------------------------------------

  deploy-to-production:
    runs-on: ubuntu-latest
    # THE FINAL MERGE: Wait for BOTH Docker pushes to finish!
    needs: [push-backend, push-frontend]   
    steps:
      - name: Update Kubernetes Manifests
        run: |
          echo "Connecting to Kubernetes Cluster..."
          echo "Running 'kubectl apply -f backend.yml'..."
          echo "Deployment successful!"
