name: My Parallel Pipeline 

on: 
  push:
    branches:
      - main 

jobs:

  # --- BOX 1 (Runs immediately) ---
  test-frontend:
    runs-on: ubuntu-latest 
    steps:
      - name: Download Frontend Code
        uses: actions/checkout@v4
      - name: Install Node js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies 
        run: npm install 
      - name: Run Frontend Tests 
        run: npm run test 

  # --- BOX 2 (Runs at the exact same time as Box 1) ---
  test-backend:
    runs-on: ubuntu-latest 
    steps:
      - name: Download Backend Code
        uses: actions/checkout@v4
      - name: Install Node js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies 
        run: npm install 
      - name: Run Backend Tests 
        run: npm run test 

  # --- BOX 3 (The Merger!) ---
  build-and-push: 
    runs-on: ubuntu-latest 
    
    # THIS IS THE MAGIC LINE! It waits for BOTH boxes above to turn green!
    needs: [test-frontend, test-backend] 
    
    steps:
      - name: Download Code
        uses: actions/checkout@v4 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push the Docker Image
        run: | 
          docker build -t jeffrinjojo/hr-backend:latest .
          docker push jeffrinjojo/hr-backend:latest
