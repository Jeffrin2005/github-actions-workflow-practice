name: My production pipeline 

on: 
  push:
    branches:
      - main 

jobs:

  test-my-code:
    runs-on: ubuntu-latest 
    steps:
      - name: 1.Download the code from the repository 
        uses: actions/checkout@v4
      - name: 2.Install Node js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 3. Install Dependencies 
        run: npm install 
      - name: 4. Run the Tests 
        run: npm run test 

  build-and-push: 
    runs-on: ubuntu-latest 
    needs: test-my-code 
    steps:
      - name: 1. Download the code again (for this new machine)
        uses: actions/checkout@v4 
      - name: 2. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: 3. Build and Push the Docker Image
        run: | 
          docker build -t jeffrinjojo/hr-backend:latest .
          docker push jeffrinjojo/hr-backend:latest
      
      
      
      
      
      
      

  

